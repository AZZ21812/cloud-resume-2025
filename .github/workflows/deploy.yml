name: Deploy Full Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # Run CI checks first
  ci-checks:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml

  # Deploy Backend (Lambda functions, DynamoDB)
  deploy-backend:
    name: Deploy Backend Infrastructure
    runs-on: ubuntu-latest
    needs: ci-checks
    outputs:
      counter-url: ${{ steps.get-outputs.outputs.counter-url }}
      chatbot-url: ${{ steps.get-outputs.outputs.chatbot-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Backend with SST
        run: |
          echo "Deploying backend infrastructure..."
          npx sst deploy --stage production

      - name: Get deployment outputs
        id: get-outputs
        run: |
          OUTPUTS=$(npx sst outputs --stage production --format json)
          COUNTER_URL=$(echo $OUTPUTS | jq -r '.counterUrl')
          CHATBOT_URL=$(echo $OUTPUTS | jq -r '.chatbotUrl')
          echo "counter-url=$COUNTER_URL" >> $GITHUB_OUTPUT
          echo "chatbot-url=$CHATBOT_URL" >> $GITHUB_OUTPUT
          echo "Counter URL: $COUNTER_URL"
          echo "Chatbot URL: $CHATBOT_URL"

      - name: Test Lambda endpoints
        run: |
          COUNTER_URL="${{ steps.get-outputs.outputs.counter-url }}"
          CHATBOT_URL="${{ steps.get-outputs.outputs.chatbot-url }}"

          echo "Testing Counter API..."
          COUNTER_RESPONSE=$(curl -s "$COUNTER_URL")
          echo "Counter Response: $COUNTER_RESPONSE"

          echo "Testing Chatbot API..."
          CHATBOT_RESPONSE=$(curl -s -X POST "$CHATBOT_URL" \
            -H "Content-Type: application/json" \
            -d '{"question": "Hello"}')
          echo "Chatbot Response: $CHATBOT_RESPONSE"

  # Deploy Frontend (S3 + CloudFront or Static Export)
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_COUNTER_API: ${{ needs.deploy-backend.outputs.counter-url }}
          NEXT_PUBLIC_CHATBOT_API: ${{ needs.deploy-backend.outputs.chatbot-url }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        if: env.S3_BUCKET != ''
        run: |
          echo "Deploying to S3 bucket: ${{ secrets.S3_BUCKET }}"
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET }} --delete
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          echo "Invalidating CloudFront distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out/
          retention-days: 7

  # Deployment summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Create deployment summary
        run: |
          echo "# 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Backend Services" >> $GITHUB_STEP_SUMMARY
          echo "- **Counter API**: ${{ needs.deploy-backend.outputs.counter-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Chatbot API**: ${{ needs.deploy-backend.outputs.chatbot-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.deploy-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.deploy-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment completed successfully!" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "# ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs for more details." >> $GITHUB_STEP_SUMMARY
